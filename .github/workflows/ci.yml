# ================================================
# Hello API — CI/CD Pipeline
# Week 5 — Docker Hub + EC2 + Auto Rollback
# ================================================

name: Hello API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ==========================================
  # Job 1 — Lint and Test
  # ==========================================
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  # ==========================================
  # Job 2 — Build and Push to Docker Hub
  # ==========================================
  build:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${DOCKER_USERNAME}/hello-api-new:${IMAGE_TAG}"
          LATEST_IMAGE="${DOCKER_USERNAME}/hello-api-new:latest"

          docker pull "$LATEST_IMAGE" || true

          docker build \
            --pull \
            --cache-from "$LATEST_IMAGE" \
            --tag "$IMAGE" \
            --tag "$LATEST_IMAGE" \
            .

          docker push "$IMAGE"
          docker push "$LATEST_IMAGE"

          echo "Published image tag: ${IMAGE_TAG}"

  # ==========================================
  # Job 3 — Deploy to EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG
          script: |
            set -e

            APP_DIR="$HOME/hello-api"
            NEW_IMAGE="${DOCKER_USERNAME}/hello-api-new:${IMAGE_TAG}"

            cd "$APP_DIR"

            test -f docker-compose.yml
            test -f .env

            trap 'docker logout >/dev/null 2>&1 || true' EXIT

            # ── Save current image as PREVIOUS before replacing ──
            # This is what the rollback job uses if deploy fails
            CURRENT_IMAGE=$(grep '^APP_IMAGE=' .env \
              | cut -d= -f2 || echo "none")

            echo "Current image: ${CURRENT_IMAGE}"
            echo "New image:     ${NEW_IMAGE}"

            # Write PREVIOUS_IMAGE to .env so rollback job can read it
            if grep -q '^PREVIOUS_IMAGE=' .env; then
              sed -i "s|^PREVIOUS_IMAGE=.*|PREVIOUS_IMAGE=${CURRENT_IMAGE}|" .env
            else
              printf '\nPREVIOUS_IMAGE=%s\n' "$CURRENT_IMAGE" >> .env
            fi

            printf '%s' "$DOCKER_PASSWORD" \
              | docker login --username "$DOCKER_USERNAME" --password-stdin

            export APP_IMAGE="$NEW_IMAGE"

            docker compose config --quiet
            docker compose pull app
            docker compose up -d --no-build app

            # ── Health check — 2 minute window (24 attempts × 5s) ──
            echo "Waiting for container to become healthy..."
            HEALTHY=false

            for attempt in $(seq 1 24); do
              HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:3000/health || true)"

              echo "Health check ${attempt}/24 → HTTP ${HTTP_STATUS}"

              if [ "$HTTP_STATUS" = "200" ]; then
                HEALTHY=true
                break
              fi

              sleep 5
            done

            if [ "$HEALTHY" = "true" ]; then
              # ── Save verified image to .env ──
              if grep -q '^APP_IMAGE=' .env; then
                sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
              else
                printf '\nAPP_IMAGE=%s\n' "$APP_IMAGE" >> .env
              fi

              echo "Saved deployed image to .env: $APP_IMAGE"
              echo "DEPLOY_STATUS=success" >> "$HOME/deploy_status"
              docker compose ps
              exit 0
            else
              # ── Mark deploy as failed for rollback job ──
              echo "DEPLOY_STATUS=failed" > "$HOME/deploy_status"
              echo "NEW_IMAGE=${NEW_IMAGE}" >> "$HOME/deploy_status"
              echo "PREVIOUS_IMAGE=${CURRENT_IMAGE}" >> "$HOME/deploy_status"

              echo "::error::Health check failed after 2 minutes"
              docker compose logs --no-color --tail=50 app db
              exit 1
            fi

  # ==========================================
  # Job 4 — Auto Rollback
  # Runs when deploy job FAILS
  # Uses appleboy/ssh-action to SSH in and
  # restore the previous working image
  # ==========================================
  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: deploy
    # KEY: this job only runs when deploy FAILS
    if: |
      always() &&
      needs.deploy.result == 'failure' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      # ── Step 1 — SSH in and rollback ────────
      - name: Rollback to previous image
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e

            APP_DIR="$HOME/hello-api"
            cd "$APP_DIR"

            # ── Read the previous image from .env ──
            PREVIOUS_IMAGE=$(grep '^PREVIOUS_IMAGE=' .env \
              | cut -d= -f2 || echo "")

            FAILED_IMAGE=$(grep '^APP_IMAGE=' .env \
              | cut -d= -f2 || echo "unknown")

            echo "=================================================="
            echo " ⚠️  ROLLBACK TRIGGERED"
            echo "=================================================="
            echo " Failed image:   ${FAILED_IMAGE}"
            echo " Rollback image: ${PREVIOUS_IMAGE}"
            echo "=================================================="

            # ── Validate we have something to roll back to ──
            if [ -z "$PREVIOUS_IMAGE" ] || [ "$PREVIOUS_IMAGE" = "none" ]; then
              echo "::error::No previous image found in .env — cannot rollback"
              echo "Manual intervention required on EC2"
              exit 1
            fi

            trap 'docker logout >/dev/null 2>&1 || true' EXIT

            printf '%s' "$DOCKER_PASSWORD" \
              | docker login --username "$DOCKER_USERNAME" --password-stdin

            # ── Pull and start previous image ──
            echo "Pulling previous image: ${PREVIOUS_IMAGE}"
            APP_IMAGE="$PREVIOUS_IMAGE" docker compose pull app

            echo "Starting previous container..."
            APP_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-build app

            # ── Verify rollback worked ──
            echo "Verifying rollback health..."
            ROLLBACK_OK=false

            for attempt in $(seq 1 12); do
              HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:3000/health || true)"

              echo "Rollback health check ${attempt}/12 → HTTP ${HTTP_STATUS}"

              if [ "$HTTP_STATUS" = "200" ]; then
                ROLLBACK_OK=true
                break
              fi

              sleep 5
            done

            if [ "$ROLLBACK_OK" = "true" ]; then
              # ── Restore APP_IMAGE in .env to previous ──
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${PREVIOUS_IMAGE}|" .env

              echo "=================================================="
              echo " ⚠️  WARNING: ROLLBACK COMPLETED SUCCESSFULLY"
              echo "=================================================="
              echo " The deployment of ${FAILED_IMAGE} FAILED"
              echo " The system has been restored to ${PREVIOUS_IMAGE}"
              echo " Action required: fix the failing commit and redeploy"
              echo "=================================================="

              docker compose ps
            else
              echo "=================================================="
              echo " 🚨 CRITICAL: ROLLBACK ALSO FAILED"
              echo "=================================================="
              echo " Failed deploy:  ${FAILED_IMAGE}"
              echo " Failed rollback: ${PREVIOUS_IMAGE}"
              echo " MANUAL INTERVENTION REQUIRED ON EC2"
              echo "=================================================="
              docker compose logs --no-color --tail=50 app
              exit 1
            fi

      # ── Step 2 — Post warning annotation ────
      # This makes GitHub show a yellow warning
      # on the pipeline summary page
      - name: Post rollback warning
        run: |
          echo "::warning title=Rollback Executed::The deployment failed and was automatically rolled back. Check the rollback job logs for details. Fix the issue and push a new commit to redeploy."

          echo ""
          echo "=================================================="
          echo " ⚠️  PIPELINE WARNING"
          echo "=================================================="
          echo " Deployment failed — automatic rollback executed"
          echo " The previous working image is now running on EC2"
          echo " This pipeline run is marked as FAILED intentionally"
          echo " Review the deploy job logs to find the root cause"
          echo "=================================================="

