# ================================================
# Hello API — CI Pipeline
# Week 3 DevOps Onboarding
# ================================================

name: CI Pipeline

# Trigger on push to main and pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────
  # Job 1 — Lint and Test
  # ──────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4 — Run linter
      - name: Lint code
        run: npm run lint

      # Step 5 — Run tests
      - name: Run tests
        run: npm test
  # ──────────────────────────────────────────────
  # Job 2 — Manual Approval Gate
  # ──────────────────────────────────────────────
  approve:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production          # ← this creates an approval gate

    steps:
      - name: Approved
        run: echo "Deployment approved"

  # ──────────────────────────────────────────────
  # Job 3 — Build and Push (now needs approval)
  # ──────────────────────────────────────────────
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: approve                   # ← now waits for approval, not test
    if: github.ref == 'refs/heads/main'   # only on main branch

    steps:
      # Step 1 — Check out code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4 — Build and push image
      # Tagged with both 'latest' and the git commit SHA
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-api-new:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-api-new:${{ github.sha }}

      # Step 5 — Print image digest for verification
      - name: Print image info
        run: |
          echo "Image pushed successfully"
          echo "Tags:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/hello-api-new:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/hello-api-new:${{ github.sha }}"
  # ==========================================
  # Deploy the published image to the EC2 server
  # ==========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Run only after the image is built, and only for pushes to main.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Configure required reviewers in the GitHub "production" environment
    # if you want approval before this job starts.
    environment: production

    steps:
      # Connect to EC2 and run the deployment commands there.
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1

        # Pass this commit's image tag to the remote server.
        env:
          IMAGE_TAG: ${{ github.sha }}

        with:
          # Connection details are stored as GitHub repository secrets.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # Make IMAGE_TAG available inside the remote script.
          envs: IMAGE_TAG

          # These commands run on EC2, not on the GitHub runner.
          script: |
            # Go to the folder containing docker-compose.yml.
            cd /opt/hello-api

            # Use the commit tag when Compose selects the app image.
            export IMAGE_TAG="$IMAGE_TAG"

            # Download the image built by the preceding job.
            docker compose pull app

            # Start the updated app container in the background.
            docker compose up -d app

            # Confirm the app's health endpoint responds successfully.
            curl --fail --retry 10 --retry-delay 3 http://localhost:3000/health
# ================================================
# hello-api — CI/CD Pipeline
# Week 5 — Full automated deployment
# ================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:     us-east-1
  ECR_REPOSITORY: hello-api
  IMAGE_TAG:      ${{ github.sha }}

jobs:

  # ──────────────────────────────────────────────
  # Job 1 — Test
  # ──────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────
  # Job 2 — Build and Push to ECR
  # Only on push to main
  # ──────────────────────────────────────────────
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker build -t $IMAGE -t $LATEST .

          docker push $IMAGE
          docker push $LATEST

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Built and pushed: $IMAGE"

  # ──────────────────────────────────────────────
  # Job 3 — Deploy to EC2
  # Only runs after build succeeds
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            IMAGE="${{ needs.build.outputs.image }}"
            echo "Deploying image: $IMAGE"
            bash ~/deploy.sh "$IMAGE"

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}:3000/health)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Deployment verified — app is healthy"
          else
            echo "Deployment verification failed — HTTP $HTTP_CODE"
            exit 1
          fi
