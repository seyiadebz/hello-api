# ================================================
# Hello API — CI Pipeline
# Week 3 DevOps Onboarding
# ================================================

name: CI Pipeline

# Trigger on push to main and pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────
  # Job 1 — Lint and Test
  # ──────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4 — Run linter
      - name: Lint code
        run: npm run lint

      # Step 5 — Run tests
      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # Job 2 — Build and Push Docker Image
  # Only runs after test job passes
  # Only runs on push to main (not PRs)
  # ──────────────────────────────────────────────
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test                    # waits for test job
    if: github.ref == 'refs/heads/main'   # only on main branch

    steps:
      # Step 1 — Check out code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4 — Build and push image
      # Tagged with both 'latest' and the git commit SHA
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-api-new:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-api-new:${{ github.sha }}

      # Step 5 — Print image digest for verification
      - name: Print image info
        run: |
          echo "Image pushed successfully"
          echo "Tags:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/hello-api-new:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/hello-api-new:${{ github.sha }}"

