# ================================================
# hello-api CI/CD Pipeline
# Week 5 — Docker Hub + appleboy/ssh-action
# ================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────
  # Job 1 — Lint and Test
  # Runs on every push and pull request
  # ──────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────
  # Job 2 — Build and Push to Docker Hub
  # Only runs on push to main (not PRs)
  # Only runs if tests passed
  # ──────────────────────────────────────────────
  build:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        id: build-push
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/hello-api-new:${{ github.sha }}
          LATEST=${{ secrets.DOCKER_USERNAME }}/hello-api-new:latest

          # Pull latest for build cache
          docker pull $LATEST 2>/dev/null || true

          # Build image tagged with SHA and latest
          docker build \
            --cache-from $LATEST \
            -t $IMAGE \
            -t $LATEST .

          # Push both tags
          docker push $IMAGE
          docker push $LATEST

          # Pass image URL to deploy job
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          echo "Pushed: $IMAGE"
          echo "Pushed: $LATEST"

  # ──────────────────────────────────────────────
  # Job 3 — Deploy to EC2
  # Uses appleboy/ssh-action
  # Only runs after build succeeds
  # Only runs on push to main
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:

      # ── Step 1 — SSH into EC2 and deploy ──────
      - name: Deploy via appleboy/ssh-action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/hello-api"
            NEW_IMAGE="${{ needs.build.outputs.image }}"

            echo "=========================================="
            echo " Deploying: $NEW_IMAGE"
            echo " Time: $(date)"
            echo "=========================================="

            # ── Clone or pull latest code ──────────
            if [ -d "$APP_DIR/.git" ]; then
              echo "Repo exists — pulling latest..."
              cd "$APP_DIR"
              git pull origin main
            else
              echo "First deploy — cloning repo..."
              git clone https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ── Login to Docker Hub ────────────────
            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | \
              docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # ── Pull new image ─────────────────────
            # Pull BEFORE stopping old container
            # so downtime is minimal
            echo "Pulling new image..."
            docker pull "$NEW_IMAGE"

            # ── Deploy with docker compose ─────────
            # APP_IMAGE env var overrides the image in docker-compose.yml
            echo "Starting new container..."
            APP_IMAGE="$NEW_IMAGE" docker compose up -d --no-build

            # ── Clean up old images ────────────────
            echo "Cleaning up..."
            docker image prune -f

            # ── Health check ───────────────────────
            echo "Waiting for app to start..."
            sleep 5

            HEALTH=$(curl -sf http://localhost:3000/health \
              | grep -o '"status":"ok"' || echo "failed")

            if [ "$HEALTH" = '"status":"ok"' ]; then
              echo "Health check PASSED"
            else
              echo "Health check FAILED"
              docker logs hello-api --tail 20
              exit 1
            fi

            echo "=========================================="
            echo " Deploy complete"
            docker ps
            echo "=========================================="

      # ── Step 2 — Verify from outside EC2 ──────
      - name: Verify deployment from outside
        run: |
          echo "Waiting for app to be reachable..."
          sleep 10

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}:3000/health)

          echo "HTTP status: $HTTP"

          if [ "$HTTP" = "200" ]; then
            echo "Deployment verified successfully"
          else
            echo "Deployment verification failed — got HTTP $HTTP"
            exit 1
          fi

